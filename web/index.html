<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slotledger</title>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f1f1ed; --hover: #f7f7f4; --border: #e4e4de; --text: #1c1c1a; --muted: #67675f; --faint: #9b9b93;
  --accent: #3c57c9; --accent-soft: #eaeefc;
  --ok: #237a3b; --ok-soft: #e3f3e7; --warn: #a65400; --warn-soft: #fdf0e1; --info: #1f6fb8; --info-soft: #e3effa; --bad: #b42323; --bad-soft: #fbe7e7; --gray: #8d8d86;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --drawer: 520px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --surface: #1b1b1a; --surface-2: #242422; --hover: #20201e; --border: #30302d; --text: #ebebe7; --muted: #a3a39c; --faint: #74746e;
    --accent: #8ea2ff; --accent-soft: #232a4b;
    --ok: #6fcf86; --ok-soft: #17301e; --warn: #f0a656; --warn-soft: #372512; --info: #72b4f0; --info-soft: #152b40; --bad: #f08080; --bad-soft: #3a1818; --gray: #7c7c76;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
body.open main.wrap { margin-right: calc(var(--drawer) + 24px); max-width: none; }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
.bar { display: flex; align-items: center; gap: 24px; height: 52px; }
.brand { font-weight: 650; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 450; }
nav { display: flex; gap: 2px; align-self: stretch; }
nav a { display: flex; align-items: center; padding: 0 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav a:hover { color: var(--text); }
nav a.on { color: var(--text); border-color: var(--accent); font-weight: 550; }
nav .n { margin-left: 6px; font-size: 11.5px; min-width: 18px; text-align: center; padding: 0 5px; border-radius: 9px; background: var(--surface-2); color: var(--muted); }
nav .n.hot { background: var(--warn); color: #fff; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 16px; min-width: 0; flex: 0 1 auto; }
#search { width: 260px; min-width: 120px; flex: 0 1 260px;padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
#search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.live { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.live.off i { background: var(--bad); }

main { padding: 28px 0 80px; }
.page-title { font-size: 22px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 4px; }
.page-sub { color: var(--muted); margin: 0 0 24px; }
.page-sub b { color: var(--text); font-weight: 600; }
h2 { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); margin: 28px 0 8px; }
h2 .n { color: var(--faint); font-weight: 450; }
h2 .more { margin-left: auto; font-weight: 450; color: var(--accent); font-size: 13px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; }
body.open .cols { grid-template-columns: 1fr; }

/* ---------- rows: the outline layer ---------- */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--border); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row .main { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .k { font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; flex-shrink: 0; }
.row .side { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.row.wide .main { display: grid; grid-template-columns: 96px 190px minmax(0, 1fr); align-items: baseline; }
.tag { font-size: 11.5px; font-weight: 600; line-height: 18px; padding: 0 7px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; justify-self: start; }
.tag.goal { background: #ece6fb; color: #6741c5; }
.tag.approach { background: #e3effa; color: #1f63a8; }
.tag.env { background: #e1f3ef; color: #17785f; }
.tag.assum { background: #fdf0dc; color: #9a5a00; }
.tag.dep { background: #eeeeea; color: #5f5f58; }
.tag.constraint { background: #fbe7ea; color: #b02a43; }
@media (prefers-color-scheme: dark) {
  .tag.goal { background: #2d2350; color: #b9a2f5; }
  .tag.approach { background: #152b40; color: #7fb8ef; }
  .tag.env { background: #123129; color: #6fd1b4; }
  .tag.assum { background: #372512; color: #f0b061; }
  .tag.dep { background: #2a2a27; color: #b3b3ab; }
  .tag.constraint { background: #3a1820; color: #f08ea0; }
}
.row.dim .t { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); justify-self: center; }
.dot.decided, .dot.verified { background: var(--ok); }
.dot.proposed, .dot.in_progress, .dot.implemented { background: var(--warn); }
.dot.accepted_by_default, .dot.todo { background: var(--info); }
.dot.rejected, .dot.stale, .dot.question, .dot.needs_review { background: var(--bad); }
.handoff { white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
.dot.retired, .dot.dropped { background: transparent; border: 1.5px solid var(--gray); }
.flag { font-size: 11.5px; font-weight: 600; padding: 0 7px; border-radius: 10px; line-height: 18px; }
.flag.bad { background: var(--bad-soft); color: var(--bad); }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.flag.ok { background: var(--ok-soft); color: var(--ok); }
.flag.gray { background: var(--surface-2); color: var(--muted); }
.empty { padding: 18px 14px; color: var(--faint); }
.dup { border-top: 1px solid var(--border); }
.dup:first-child { border-top: 0; }
.dup .row + .row { border-top: 1px dashed var(--border); }
.calm { padding: 22px; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); text-align: center; background: var(--surface); }

.summary { display: flex; gap: 28px; margin: 0 0 4px; }
.summary a { display: flex; flex-direction: column; }
.summary b { font-size: 20px; font-weight: 650; }
.summary small { color: var(--muted); font-size: 12.5px; }
.summary a:hover small { color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
.filters button { font-size: 13px; padding: 3px 11px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
.filters button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.filters label { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.group { cursor: pointer; user-select: none; }
.group::before { content: "▾"; color: var(--faint); width: 10px; display: inline-block; }
.group.closed::before { content: "▸"; }

.day { font-size: 12px; color: var(--faint); margin: 20px 0 6px; font-weight: 600; }
.day:first-child { margin-top: 0; }
.ev { grid-template-columns: 14px minmax(0, 1fr) auto; }
.ev .who { color: var(--faint); font-size: 12px; }

/* ---------- drawer: the detail layer ---------- */
.drawer { position: fixed; top: 53px; right: 0; bottom: 0; width: var(--drawer); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.05); overflow-y: auto; transform: translateX(100%); transition: transform .18s ease; z-index: 4; }
body.open .drawer { transform: none; }
.d-head { position: sticky; top: 0; background: var(--surface); padding: 14px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.d-head .k { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { margin-left: auto; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--faint); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.x:hover { background: var(--surface-2); color: var(--text); }
.d-body { padding: 18px 20px 40px; }
.d-title { font-size: 17px; font-weight: 600; line-height: 1.45; margin: 0 0 8px; overflow-wrap: anywhere; }
.d-status { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.d-sec { margin-top: 22px; }
.d-sec > .lbl { font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.d-sec p { margin: 0; overflow-wrap: anywhere; }
.quote { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }
.quote::after { content: " — user"; color: var(--muted); font-size: 12.5px; }
.alert { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert p + p { margin-top: 6px; }
.mini { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.mini .row { padding: 7px 10px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.opt b { font-family: var(--mono); margin-right: 8px; }
.opt.rec { border-color: var(--ok); }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
.hist { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--border); }
.hist li { position: relative; padding: 0 0 14px 8px; }
.hist li::before { content: ""; position: absolute; left: -21px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); }
.hist li.cur::before { background: var(--accent); border-color: var(--accent); }
.hist .v { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.hist .m { color: var(--faint); font-size: 12.5px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre { background: var(--surface-2); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; }
/* ---------- actions ---------- */
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.btn { font-size: 13px; padding: 4px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.btn.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.row .quick { display: none; gap: 4px; }
.row:hover .quick { display: flex; }
.row .quick .btn { padding: 1px 9px; font-size: 12px; }
.form { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.form label { font-size: 12px; font-weight: 600; color: var(--faint); }
.form textarea, .form input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; resize: vertical; }
.form textarea:focus, .form input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.htag { font-size: 11px; font-weight: 600; line-height: 17px; padding: 0 6px; border-radius: 5px; border: 1px solid; white-space: nowrap; }
.htag.human-edit { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.htag.human-approved, .htag.human-decided { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.htag.human-rejected { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 10; pointer-events: none; max-width: 520px; }
#toast.on { opacity: 1; transform: translateX(-50%); }
#toast.err { background: var(--bad); color: #fff; }
.banner { margin-bottom: 18px; padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); }
@media (max-width: 960px) { .brand span { display: none; } .bar { gap: 14px; } nav a { padding: 0 8px; } .live span { display: none; } }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } .row.wide .main { grid-template-columns: 96px 150px minmax(0, 1fr); } body.open main.wrap { margin-right: 0; } }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">slotledger <span id="project"></span></div>
    <nav id="nav"></nav>
    <div class="tools">
      <input id="search" type="search" placeholder="Search decisions and tasks" autocomplete="off">
      <div class="live" id="live"><i></i><span id="liveText">Connecting…</span></div>
    </div>
  </div>
</header>
<main class="wrap" id="main"><div class="calm">Loading…</div></main>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<div id="toast" role="status"></div>

<script>
"use strict";
const CATS = ["goal", "approach", "env", "assum", "dep", "constraint"];
const CAT_LABEL = { goal: "Goals", approach: "Approach", env: "Environment", assum: "Assumptions", dep: "Dependencies", constraint: "Constraints" };
const CAT_TAG = { goal: "Goal", approach: "Approach", env: "Environment", assum: "Assumption", dep: "Dependency", constraint: "Constraint" };
const tag = (c) => h`<span class="tag ${c}">${CAT_TAG[c] ?? c}</span>`;
const nameOf = (key) => key.slice(key.indexOf("/") + 1);
const STATUS = { decided: "Decided", proposed: "Proposed by AI", accepted_by_default: "Accepted by default", rejected: "Rejected", retired: "Retired", deleted: "Deleted" };
const TASK = { needs_review: "Needs review", in_progress: "In progress", todo: "To do", implemented: "Implemented, not verified", verified: "Verified", dropped: "Dropped", suspended: "Suspended", archived: "Archived" };
const TABS = [["overview", "Overview"], ["decisions", "Decisions"], ["tasks", "Tasks"], ["activity", "Activity"]];
const ASKS = ["goal", "approach", "env", "assum"]; // categories the end-of-turn report asks about
const TOKEN = "__SLOTLEDGER_TOKEN__"; // filled in by the server; writes are refused without it
const SOURCE = { run: "ran by slotledger", ref: "by reference", human: "by a person" };
const SOURCE_NOTE = { run: "", ref: " (by reference)", human: " (by a person)" };
const TAG_TIP = { "human-edit": "Edited by a person in the web view", "human-approved": "A person approved this AI proposal", "human-rejected": "A person rejected this", "human-decided": "A person decided this" };

let data = null, etag = null, lastOk = 0, D = null;
const ui = { tab: "overview", sel: null, cat: "all", showOld: false, q: "", closed: new Set(), sessions: false };
try { Object.assign(ui, JSON.parse(localStorage.getItem("slotledger-ui2") || "{}")); ui.closed = new Set(ui.closed || []); ui.q = ""; ui.sel = null; } catch {}
const saveUi = () => { try { localStorage.setItem("slotledger-ui2", JSON.stringify({ cat: ui.cat, showOld: ui.showOld, closed: [...ui.closed], sessions: ui.sessions })); } catch {} };

// ---------- helpers ----------
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
class Raw { constructor(s) { this.s = s; } }
/** Tagged template: interpolations are escaped unless they are Raw (or arrays of Raw) */
function h(strings, ...vals) {
  const one = (x) => (x instanceof Raw ? x.s : x === false || x == null ? "" : esc(x));
  let out = strings[0];
  vals.forEach((v, i) => { out += (Array.isArray(v) ? v.map(one).join("") : one(v)) + strings[i + 1]; });
  return new Raw(out);
}
const short = (id) => String(id ?? "").replace(/^conn-/, "").slice(0, 8);
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const when = (iso) => h`<time datetime="${iso}" title="${new Date(iso).toLocaleString()}">${ago(iso)}</time>`;
const match = (...parts) => !ui.q || parts.flat().join(" ").toLowerCase().includes(ui.q.toLowerCase());
const live = (s) => s.current && !s.current.retired;
const slotOf = (k) => data.slots.find((s) => s.key === k);
const taskOf = (slug) => data.tasks.find((t) => t.slug === slug);
const shown = (s) => s.current ?? s.versions[s.versions.length - 1];
const slotStatus = (s) => (s.deleted ? "deleted" : !s.current ? "rejected" : s.current.retired ? "retired" : s.current.status);
const htag = (t) => (t ? h`<span class="htag ${t}" title="${TAG_TIP[t]}">${t}</span>` : "");
const canJudge = (v) => v && !v.retired && v.source === "agent" && !v.confirmed;
const isSel = (type, id) => ui.sel && ui.sel.type === type && ui.sel.id === id;
const open = (type, id) => new Raw(`data-open="${esc(type + ":" + id)}"`);
const actor = (a) => (!a ? "" : a.kind === "human" ? (a.channel === "web" ? "you, in the web view" : "you") : a.kind === "agent" ? "AI" : "slotledger");

// ---------- derived ----------
function derive() {
  const userQs = data.questions.filter((q) => q.status === "open" && q.forUser);
  const proposed = data.slots.filter((s) => live(s) && s.current.status === "proposed" && ASKS.includes(s.category));
  // stale ones already covered by a question for the user are not listed twice
  const asked = new Set(userQs.flatMap((q) => (q.origin === "stale_premise" ? [q.about[0]] : [])));
  const stale = data.slots.filter((s) => live(s) && s.stale.length && !asked.has(s.key));
  const openTasks = data.tasks.filter((t) => t.lifecycle === "live" && t.status !== "verified" && t.status !== "dropped");
  const review = openTasks.filter((t) => t.status === "needs_review");
  const starts = data.sessions.map((s) => ({ id: s.id, at: s.start.at }));
  const sessionsSince = (v) => new Set(starts.filter((s) => s.at > v.at && s.id !== v.session).map((s) => s.id)).size;
  return { userQs, proposed, stale, openTasks, review, sessionsSince, needs: userQs.length + stale.length + review.length };
}

// ---------- rows (outline layer) ----------
function slotRow(s, wide = true, quick = false) {
  const v = shown(s), st = slotStatus(s);
  return h`<div class="row ${wide ? "wide" : ""} ${live(s) ? "" : "dim"} ${isSel("slot", s.key) ? "sel" : ""}" ${open("slot", s.key)}>
    <span class="dot ${s.stale.length && live(s) ? "stale" : st}" title="${STATUS[st]}"></span>
    <span class="main">${tag(s.category)}<span class="k" title="${s.key}">${nameOf(s.key)}</span><span class="t">${v.value}</span></span>
    <span class="side">${quick && canJudge(s.current) ? h`<span class="quick"><button class="btn ok" data-act="approve" data-key="${s.key}">Approve</button><button class="btn bad" data-act="reject" data-key="${s.key}">Reject</button></span>` : ""}${s.stale.length && live(s) ? h`<span class="flag bad">premise changed</span>` : ""}${st === "proposed" ? h`<span class="flag warn">AI proposal</span>` : ""}${htag(v.tag)}${when(v.at)}</span>
  </div>`;
}
function taskRow(t) {
  const failed = t.lastFailed && (!t.evidence || t.lastFailed.at > t.evidence.at);
  return h`<div class="row ${t.status === "dropped" || t.lifecycle !== "live" ? "dim" : ""} ${isSel("task", t.slug) ? "sel" : ""}" ${open("task", t.slug)}>
    <span class="dot ${t.status}" title="${TASK[t.status]}"></span>
    <span class="main"><span class="t">${t.title}</span><span class="k">${t.slug}</span></span>
    <span class="side">${failed && t.status !== "verified" ? h`<span class="flag bad">check failed</span>` : ""}${t.status === "needs_review" ? h`<span class="flag bad">needs review</span>` : t.status === "verified" ? h`<span class="flag ok">verified</span>` : t.waitingOn?.length ? h`<span class="flag warn">waiting on review</span>` : ""}</span>
  </div>`;
}
function questionRow(q) {
  return h`<div class="row ${isSel("q", q.qid) ? "sel" : ""}" ${open("q", q.qid)}>
    <span class="dot question"></span>
    <span class="main"><span class="t">${q.text}</span></span>

    case "slot.deleted": return ["deleted", ["slot", d.key], `Deleted ${d.key}`];
    case "slot.relocked": return ["decided", ["slot", d.key], d.repoint ? `${d.key} now rests on the pieces of a split` : `${d.key} v${d.n} still holds: ${d.note}`];
    case "task.edited": return ["plain", ["task", d.slug], d.title ? `Renamed ${d.slug} to “${d.title}”` : `Updated ${t(d.slug)}${d.note ? `: ${d.note}` : ""}`];
    case "task.handoff": return ["plain", ["task", d.slug], `Wrote a handoff for ${t(d.slug)}`];
    case "task.lifecycle": return ["dropped", ["task", d.slug], `${d.lifecycle === "live" ? "Resumed" : d.lifecycle === "suspended" ? "Suspended" : "Archived"} ${t(d.slug)}: ${d.note}`];
    case "version.confirmed": return ["decided", ["slot", d.key], `Approved ${d.key} v${d.n}`];
    case "version.rejected": return ["rejected", ["slot", d.key], `Rejected ${d.key} v${d.n}${d.replacement ? `, replaced with “${d.replacement}”` : ""}`];
    case "task.created": return ["todo", ["task", d.slug], `New task: ${d.title}`];
    case "task.status": return [d.status, ["task", d.slug], `${t(d.slug)} → ${TASK[d.status] ?? d.status}`];
    case "task.rebased": return ["decided", ["task", d.slug], `Re-checked ${t(d.slug)} against the current decisions: ${d.note}`];
    case "task.verified": return ["verified", ["task", d.slug], `${d.kind === "human" ? "Accepted" : "Verified"} ${t(d.slug)}${SOURCE_NOTE[d.kind ?? "run"]}`];

      <label for="f-reason">Why reject it? (optional; the AI sees this)</label><input id="f-reason" placeholder="e.g. we never ship on Linux" value="${draft("f-reason", "")}">
      <div class="acts"><button class="btn bad" data-act="reject" data-key="${s.key}" data-confirmed="1">Reject</button><button class="btn ghost" data-cancel>Cancel</button></div>
      <p class="hint">Rejecting tells the AI this was wrong. If you'd rather it simply forgot the idea, delete it instead.</p>
    </div>`;
  const live_ = v && !v.retired;
  return h`<div class="acts">
    ${canJudge(v) ? h`<button class="btn ok" data-act="approve" data-key="${s.key}">Approve</button><button class="btn bad" data-act="reject" data-key="${s.key}">Reject…</button>` : ""}
    ${live_ && s.stale.length ? h`<button class="btn ok" data-act="keep" data-key="${s.key}" title="Its premise changed but it still holds">Still holds</button>` : ""}
    ${live_ ? h`<button class="btn" data-act="open-edit" data-key="${s.key}">Edit</button>` : ""}
    <button class="btn ghost" data-act="delete" data-key="${s.key}">Delete</button>
  </div>`;
}

let toastTimer = 0;
function toast(msg, err = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "on" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = err ? "err" : ""; }, err ? 5000 : 2600);
}
async function act(body) {
  try {
    const r = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json", "X-Slotledger-Token": TOKEN }, body: JSON.stringify(body) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.error || `Failed (${r.status})`);
    toast(res.message || "Done");
    return true;
  } catch (err) {
    toast(err.message, true);
    return false;
  } finally {
    etag = null; // fetch the new state right away
    clearTimeout(pollTimer);
    poll();
  }
}
async function onAct(btn) {
  const { act: a, key } = btn.dataset;
  if (a === "open-edit") { form.edit = key; form.reject = null; render(); document.getElementById("f-value")?.focus(); return; }
  if (a === "reject" && !btn.dataset.confirmed && ui.sel?.id === key) { form.reject = key; form.edit = null; render(); document.getElementById("f-reason")?.focus(); return; }
  if (a === "delete" && !confirm(`Delete ${key}?\n\nThe AI won't see it any more and the key can be reused. It stays in the activity log.`)) return;
  btn.disabled = true;
  const body = { action: a, key };
  if (a === "edit") { body.value = document.getElementById("f-value").value; body.rationale = document.getElementById("f-why").value; }
  if (a === "reject") body.reason = document.getElementById("f-reason")?.value ?? "";
  if (a === "check") { body.task = btn.dataset.task; body.passed = !!btn.dataset.passed; body.scope = document.getElementById("f-check-scope")?.value; body.text = document.getElementById("f-check-note")?.value; delete body.key; }
  if (a === "answer") { body.question = btn.dataset.q; body.choice = btn.dataset.choice || undefined; body.text = btn.dataset.choice ? undefined : document.getElementById("f-answer")?.value; }
  const ok = await act(body);
  if (ok) {
    form.edit = form.reject = null;
    form.draft = {};
    if (a === "delete" && ui.sel?.id === key) go(null);
    else document.getElementById("drawer").scrollTop = 0;
  }
  btn.disabled = false;
}

// ---------- render ----------
function render() {
  if (!data) return;
  D = derive();
  numberVersions();
  document.getElementById("project").textContent = "· " + data.project;
  document.title = `${data.project} · slotledger`;
  const badge = { overview: [D.needs, true], decisions: [data.slots.filter(live).length], tasks: [D.openTasks.length], activity: [0] };
  document.getElementById("nav").innerHTML = TABS.map(([id, label]) => {
    const [n, hot] = badge[id];
    return h`<a href="#${id}" class="${ui.tab === id && !ui.q ? "on" : ""}">${label}${n ? h`<span class="n ${hot ? "hot" : ""}">${n}</span>` : ""}</a>`.s;
  }).join("");
  const page = ui.q ? searchPage() : { overview, decisions, tasks, activity }[ui.tab]();
  const banner = data.errors ? h`<div class="banner">⚠ slotledger failed to sync ${data.errors} time(s); some records may be missing (.project/run/errors.log).</div>` : "";
  const y = window.scrollY;
  document.getElementById("main").innerHTML = h`${banner}${page}`.s;
  window.scrollTo(0, y);

  const drawer = document.getElementById("drawer");
  const item = ui.sel && (ui.sel.type === "slot" ? slotOf(ui.sel.id) : ui.sel.type === "task" ? taskOf(ui.sel.id) : data.questions.find((q) => q.qid === ui.sel.id));
  document.body.classList.toggle("open", !!item);
  // a live update must not wipe what someone is typing in the drawer
  if (drawer.contains(document.activeElement) && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
  const dy = drawer.scrollTop;
  drawer.innerHTML = item ? (ui.sel.type === "slot" ? slotDetail(item) : ui.sel.type === "task" ? taskDetail(item) : questionDetail(item)).s : "";
  drawer.scrollTop = dy;
}

function route() {
  const [tab, type, ...rest] = decodeURIComponent(location.hash.slice(1)).split("/");
  const next = TABS.some(([id]) => id === tab) ? tab : "overview";
  const switched = next !== ui.tab;
  const prevSel = ui.sel && ui.sel.type + ":" + ui.sel.id;
  ui.tab = next;
  ui.sel = type && rest.length ? { type, id: rest.join("/") } : null;
  if (!ui.sel || ui.sel.id !== form.edit) form.edit = null;
  if (!ui.sel || ui.sel.id !== form.reject) form.reject = null;
  if (!form.edit && !form.reject) form.draft = {};
  render();
  if (switched) window.scrollTo(0, 0);
  if (ui.sel && prevSel !== ui.sel.type + ":" + ui.sel.id) document.getElementById("drawer").scrollTop = 0;
}
const go = (sel) => { location.hash = ui.tab + (sel ? `/${sel.type}/${sel.id}` : ""); };

document.addEventListener("click", (e) => {
  const t = e.target;
  const btn = t.closest("[data-act]");
  if (btn) { e.stopPropagation(); return onAct(btn); }
  if (t.closest("[data-cancel]")) { form.edit = form.reject = null; form.draft = {}; return render(); }
  const o = t.closest("[data-open]");
  if (o) {
    const [type, ...id] = o.dataset.open.split(":");
    if (ui.q) { ui.q = ""; document.getElementById("search").value = ""; ui.tab = type === "task" ? "tasks" : "decisions"; }
    return go({ type, id: id.join(":") });
  }
  if (t.closest("[data-close]")) return go(null);
  const cat = t.closest("[data-cat]");
  if (cat) { ui.cat = cat.dataset.cat; saveUi(); return render(); }
  const tg = t.closest("[data-toggle]");
  if (tg) { const k = tg.dataset.toggle; ui.closed.has(k) ? ui.closed.delete(k) : ui.closed.add(k); saveUi(); return render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "showOld") { ui.showOld = e.target.checked; saveUi(); render(); }
  if (e.target.id === "sessions") { ui.sessions = e.target.checked; saveUi(); render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && ui.sel) go(null);
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("search").focus(); }
});
document.addEventListener("input", (e) => { if (/^f-/.test(e.target.id)) form.draft[e.target.id] = e.target.value; });
document.getElementById("search").addEventListener("input", (e) => { ui.q = e.target.value.trim(); render(); });
window.addEventListener("hashchange", route);

// ---------- live updates ----------
async function poll() {
  try {
    const r = await fetch("/api/state", { headers: etag ? { "If-None-Match": etag } : {}, cache: "no-store" });
    if (r.status === 200) {
      data = await r.json();
      etag = r.headers.get("ETag");
      const first = !lastOk;
      lastOk = Date.now();
      first ? route() : render();
    } else if (r.status === 304) lastOk = Date.now();
    else throw new Error(String(r.status));
    setLive(true);
  } catch {
    setLive(false);
  }
  pollTimer = setTimeout(poll, document.hidden ? 10000 : 2000);
}
let pollTimer = 0;
function setLive(ok) {
  document.getElementById("live").classList.toggle("off", !ok);
  document.getElementById("liveText").textContent = ok ? "Live" : lastOk ? "Reconnecting…" : "Can't reach slotledger web";
}
setInterval(() => document.querySelectorAll("time[datetime]").forEach((t) => { t.textContent = ago(t.getAttribute("datetime")); }), 30000);
poll();
</script>
</body>
</html>
