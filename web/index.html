<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slotboard</title>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0f0ec; --border: #e2e2dc; --text: #1c1c1a; --muted: #6a6a64; --faint: #9a9a93;
  --accent: #3c57c9; --accent-soft: #e8ecfb;
  --ok: #237a3b; --ok-soft: #e3f3e7; --warn: #a65400; --warn-soft: #fdf0e1; --info: #1f6fb8; --info-soft: #e3effa; --bad: #b42323; --bad-soft: #fbe6e6;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --surface: #1b1b1a; --surface-2: #232321; --border: #2f2f2c; --text: #ebebe7; --muted: #a2a29b; --faint: #72726c;
    --accent: #8ea2ff; --accent-soft: #23294a;
    --ok: #6fcf86; --ok-soft: #17301e; --warn: #f0a656; --warn-soft: #372512; --info: #72b4f0; --info-soft: #152b40; --bad: #f08080; --bad-soft: #3a1818;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
a { color: inherit; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }

header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.bar { display: flex; align-items: center; gap: 14px; height: 56px; }
.brand { font-weight: 650; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-weight: 450; }
.live { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.live.off .dot { background: var(--bad); }
#search { width: 220px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav a { padding: 8px 12px 10px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; }
nav a.on { color: var(--text); border-color: var(--accent); }
nav a .n { margin-left: 5px; font-size: 12px; padding: 0 6px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
nav a .n.hot { background: var(--warn-soft); color: var(--warn); }

main { padding: 24px 0 64px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 28px 0 10px; }
h2:first-child { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); text-decoration: none; display: block; }
.stat b { display: block; font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
.stat small { color: var(--muted); font-size: 13px; }
.stat.hot b { color: var(--warn); }
.stat.bad b { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); scroll-margin-top: 120px; transition: box-shadow .3s; }
.card.flash { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.card.dim { opacity: .65; }
.head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.key { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.value { font-size: 16px; font-weight: 550; margin: 6px 0 4px; overflow-wrap: anywhere; }
.why { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.quote { margin: 8px 0 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 14px; overflow-wrap: anywhere; }
.quote::before { content: "“"; } .quote::after { content: "” — user"; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.meta .lbl { color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 550; padding: 1px 8px; border-radius: 20px; white-space: nowrap; }
.pill.decided, .pill.verified { background: var(--ok-soft); color: var(--ok); }
.pill.proposed, .pill.implemented, .pill.in_progress { background: var(--warn-soft); color: var(--warn); }
.pill.accepted_by_default, .pill.todo { background: var(--info-soft); color: var(--info); }
.pill.rejected, .pill.dropped, .pill.stale, .pill.failed { background: var(--bad-soft); color: var(--bad); }
.pill.plain { background: var(--surface-2); color: var(--muted); }
.chip { font-family: var(--mono); font-size: 12px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); text-decoration: none; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip.stale { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.right { margin-left: auto; color: var(--faint); font-size: 13px; white-space: nowrap; }
.warn { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-size: 14px; }
.hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.opt { border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 14px; background: var(--surface-2); }
.opt b { font-family: var(--mono); margin-right: 6px; }
.opt.rec { border-color: var(--ok); }
.opt.rec::after { content: " recommended"; color: var(--ok); font-size: 12px; }

details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
.hist { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--border); }
.hist li { position: relative; padding: 4px 0 8px 6px; font-size: 14px; }
.hist li::before { content: ""; position: absolute; left: -20px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); }
.hist li.cur::before { border-color: var(--accent); background: var(--accent); }
.hist .v { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
pre { background: var(--surface-2); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; align-items: center; }
.filters button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
.filters button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.filters label { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }

.cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }
.col h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
.col h3 .n { color: var(--faint); font-weight: 450; }
.col .card { padding: 12px; }
.col .value { font-size: 15px; }
.empty { color: var(--faint); font-size: 14px; padding: 12px 0; }
.emptybig { text-align: center; color: var(--muted); padding: 32px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }

.feed { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.feed li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 14px; align-items: baseline; }
.feed li:first-child { border-top: 0; }
.feed .ic { text-align: center; color: var(--muted); }
.feed .what { overflow-wrap: anywhere; }
.feed .who { color: var(--faint); font-size: 12px; margin-left: 4px; }
.feed .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
.day { font-size: 12px; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.banner { margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 14px; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
.split > aside { position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow-y: auto; }
.split > aside .feed li { grid-template-columns: 18px 1fr; }
.split > aside .feed .when { grid-column: 2; }
#search { width: 280px; }
/* narrow desktop windows */
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } .split > aside { position: static; max-height: none; } .cols { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand">slotboard <span id="project"></span></div>
      <div class="live" id="live"><span class="dot"></span><span id="liveText">Connecting…</span></div>
      <input id="search" type="search" placeholder="Search decisions, tasks…" autocomplete="off">
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="emptybig">Loading…</div></main>

<script>
"use strict";
const CATS = ["product", "arch", "platform", "assum", "dep", "constraint"];
const CAT_LABEL = { product: "Product", arch: "Architecture", platform: "Platform", assum: "Assumptions", dep: "Dependencies", constraint: "Constraints" };
const STATUS_LABEL = { decided: "Decided", proposed: "Proposed", accepted_by_default: "Accepted by default", rejected: "Rejected" };
const TASK_LABEL = { todo: "To do", in_progress: "In progress", implemented: "Implemented", verified: "Verified", dropped: "Dropped" };
const TABS = [["overview", "Overview"], ["decisions", "Decisions"], ["tasks", "Tasks"], ["activity", "Activity"], ["sessions", "Sessions"]];

let data = null, etag = null, lastOk = 0;
const ui = { tab: "overview", cat: "all", showOld: false, q: "", open: new Set() };
try { Object.assign(ui, JSON.parse(localStorage.getItem("slotboard-ui") || "{}"), { open: new Set(), q: "" }); } catch {}
const saveUi = () => { try { localStorage.setItem("slotboard-ui", JSON.stringify({ cat: ui.cat, showOld: ui.showOld })); } catch {} };

// ---------- helpers ----------
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
/** Tagged template: interpolations are escaped unless they are Raw (or arrays of Raw) */
function h(strings, ...vals) {
  let out = strings[0];
  vals.forEach((v, i) => {
    const one = (x) => (x instanceof Raw ? x.s : x === false || x == null ? "" : esc(x));
    out += (Array.isArray(v) ? v.map(one).join("") : one(v)) + strings[i + 1];
  });
  return new Raw(out);
}
const short = (id) => String(id ?? "").replace(/^conn-/, "").slice(0, 8);
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  if (s < 86400 * 7) return Math.round(s / 86400) + " d ago";
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
const when = (iso) => h`<time datetime="${iso}" title="${new Date(iso).toLocaleString()}">${ago(iso)}</time>`;
const match = (...parts) => !ui.q || parts.join(" ").toLowerCase().includes(ui.q.toLowerCase());
const slotOf = (k) => data.slots.find((s) => s.key === k);
const taskOf = (slug) => data.tasks.find((t) => t.slug === slug);
const live = (s) => s.current && !s.current.retired;
const chip = (key, extra = "", label = key) => h`<a class="chip ${extra}" href="#decisions/${key}" data-go="${key}">${label}</a>`;
function actor(a) {
  if (!a) return "";
  if (a.kind === "human") return "you" + (a.via ? " (via AI)" : "");
  if (a.kind === "agent") return "AI";
  return "slotboard";
}

// ---------- derived ----------
function derive() {
  const slots = data.slots;
  const userQs = data.questions.filter((q) => q.status === "open" && q.forUser);
  const otherQs = data.questions.filter((q) => q.status === "open" && !q.forUser);
  // same categories the end-of-turn report asks about
  const proposed = slots.filter((s) => live(s) && s.current.status === "proposed" && ["product", "arch", "platform", "assum"].includes(s.category));
  const stale = slots.filter((s) => live(s) && s.stale.length);
  const openTasks = data.tasks.filter((t) => t.status !== "verified" && t.status !== "dropped");
  // sessions since a proposal, for "auto-accepts after N more sessions"
  const starts = data.sessions.map((s) => ({ id: s.id, at: s.start.at }));
  const laterSessions = (v) => new Set(starts.filter((s) => s.at > v.at && s.id !== v.session).map((s) => s.id)).size;
  return { userQs, otherQs, proposed, stale, openTasks, laterSessions };
}

// ---------- views ----------
function decisionCard(s, d) {
  const v = s.current;
  const shown = v ?? s.versions[s.versions.length - 1];
  const status = v ? (v.retired ? "retired" : v.status) : "rejected";
  const id = "slot:" + s.key;
  const left = v && v.status === "proposed" ? Math.max(0, data.config.acceptAfterSessions - d.laterSessions(v)) : 0;
  const staleKeys = new Set(s.stale.map((x) => x.key));
  return h`<div class="card ${live(s) ? "" : "dim"}" id="${s.key}">
    <div class="head">
      <span class="key">${s.key}</span>
      <span class="pill ${status === "retired" ? "plain" : status}">${status === "retired" ? "Retired" : STATUS_LABEL[status]}</span>
      ${s.stale.length ? h`<span class="pill stale">⚠ Premise changed</span>` : ""}
      <span class="pill plain">${shown.source === "user" ? "From you" : "From AI"}</span>
      <span class="right">v${shown.n} · ${when(shown.at)}</span>
    </div>
    <div class="value">${shown.value}</div>
    <div class="why">${shown.rationale}</div>
    ${shown.userQuote ? h`<div class="quote">${shown.userQuote}</div>` : ""}
    ${s.stale.length ? h`<div class="warn">${s.stale.map((x) => {
      const dep = slotOf(x.key);
      const now = dep?.current;
      return h`<div>Rests on ${chip(x.key, "stale")} v${x.locked}, which is now ${now ? h`v${x.current}: “${now.value}”` : "rejected"}. Does this still hold?</div>`;
    })}</div>` : ""}
    ${left ? h`<div class="hint">Proposed by AI. It becomes accepted by default after ${left} more session${left > 1 ? "s" : ""} unless you withdraw it.</div>` : ""}
    <div class="meta">
      ${shown.depends.length ? h`<span class="lbl">Depends on</span>${shown.depends.map((x) => chip(x.key, staleKeys.has(x.key) ? "stale" : "", `${x.key}@${x.n}`))}` : ""}
      ${s.dependents.length ? h`<span class="lbl">Used by</span>${s.dependents.map((k) => chip(k))}` : ""}
      ${tasksBasedOn(s.key).length ? h`<span class="lbl">Tasks</span>${tasksBasedOn(s.key).map((t) => h`<a class="chip" href="#tasks" data-task="${t.slug}">${t.slug}</a>`)}` : ""}
      ${s.topics.length ? h`<span class="lbl">Topics</span>${s.topics.map((t) => h`<span class="pill plain">${t}</span>`)}` : ""}
      ${shown.scope?.length ? h`<span class="lbl">Scope</span>${shown.scope.map((p) => h`<code>${p}</code>`)}` : ""}
    </div>
    ${s.versions.length > 1 ? h`<details data-id="${id}" ${ui.open.has(id) ? new Raw("open") : ""}>
      <summary>History · ${s.versions.length} versions</summary>
      <ul class="hist">${[...s.versions].reverse().map((x) => h`<li class="${x.n === v?.n ? "cur" : ""}">
        <span class="v">v${x.n}</span>${x.value}${x.retired ? " (retired)" : ""}
        <span class="pill ${x.status}">${STATUS_LABEL[x.status]}</span>
        <div class="why">${x.rationale}</div>
        ${x.userQuote ? h`<div class="quote">${x.userQuote}</div>` : ""}
        <div class="hint">${x.source === "user" ? "From you" : "From AI"} · ${when(x.at)}${x.session ? h` · session <span class="mono">${short(x.session)}</span>` : ""}</div>
      </li>`)}</ul>
    </details>` : ""}
  </div>`;
}
const tasksBasedOn = (key) => data.tasks.filter((t) => t.basedOn.some((b) => b.key === key) && t.status !== "dropped");

function questionCard(q) {
  return h`<div class="card">
    <div class="head">
      <span class="pill ${q.origin === "stale_premise" ? "stale" : "proposed"}">${q.origin === "stale_premise" ? "Premise changed" : "Question from AI"}</span>
      ${q.about.map((k) => chip(k))}
      <span class="right">${when(q.at)}</span>
    </div>
    <div class="value">${q.text}</div>
    ${q.options?.length ? h`<div class="opts">${q.options.map((o) => h`<span class="opt ${o.recommended ? "rec" : ""}"><b>${o.id}</b>${o.label}</span>`)}</div>` : ""}
    <div class="hint">Answer in your Claude Code session, e.g. “answer ${q.qid}: ${q.options?.[0]?.id ?? "…"}”.</div>
  </div>`;
}

function taskCard(t) {
  const id = "task:" + t.slug;
  const ev = t.evidence, fail = t.lastFailed && (!ev || t.lastFailed.at > ev.at) ? t.lastFailed : null;
  return h`<div class="card ${t.status === "dropped" ? "dim" : ""}" id="task-${t.slug}">
    <div class="head"><span class="key">${t.slug}</span>${t.needsReview.length ? h`<span class="pill stale">⚠ Needs review</span>` : ""}</div>
    <div class="value">${t.title}</div>
    ${t.note ? h`<div class="why">${t.note}</div>` : ""}
    ${t.rootCause ? h`<div class="why"><b>Root cause:</b> ${t.rootCause}</div>` : ""}
    ${t.needsReview.length ? h`<div class="warn">Based on decisions that changed: ${t.needsReview.map((x) => chip(x.key, "stale"))}</div>` : ""}
    ${t.basedOn.length ? h`<div class="meta"><span class="lbl">Based on</span>${t.basedOn.map((b) => chip(b.key, "", `${b.key}@${b.n}`))}</div>` : ""}
    ${ev ? h`<div class="meta"><span class="pill verified">✓ Passed</span><code>${ev.cmd}</code></div><div class="hint">${ev.env} · ${when(ev.at)}</div>` : ""}
    ${fail ? h`<div class="meta"><span class="pill failed">✗ Failed (exit ${fail.exit})</span><code>${fail.cmd}</code> <span>${when(fail.at)}</span></div>` : ""}
    ${(ev || fail) ? h`<details data-id="${id}" ${ui.open.has(id) ? new Raw("open") : ""}><summary>Output</summary><pre>${(fail ?? ev).outputTail || "(no output)"}</pre></details>` : ""}
  </div>`;
}

function describe(e, nByEvent) {
  const d = e.data, t = (slug) => taskOf(slug)?.title ?? slug;
  switch (e.type) {
    case "session.started": return ["▶", h`Session <span class="mono">${short(d.session)}</span> started${d.client?.name ? ` (${d.client.name}${d.client.version ? " " + d.client.version : ""})` : ""}`];
    case "session.ended": return ["■", h`Session <span class="mono">${short(d.session)}</span> ended`];
    case "slot.versioned": return ["◆", d.retired ? h`Retired ${chip(d.key)}` : h`${chip(d.key)} v${nByEvent.get(e.id) ?? "?"}: ${d.value}`];
    case "version.confirmed": return ["✓", h`Confirmed ${chip(d.key)} v${d.n}`];
    case "version.rejected": return ["↺", h`Withdrew ${chip(d.key)} v${d.n}${d.replacement ? `, replaced with “${d.replacement}”` : ""}`];
    case "task.created": return ["+", h`New task: ${d.title}`];
    case "task.status": return ["→", h`${t(d.slug)} → <span class="pill ${d.status}">${TASK_LABEL[d.status]}</span>${d.note ? ` ${d.note}` : ""}`];
    case "task.verified": return ["✓", h`Verified ${t(d.slug)} with <code>${d.cmd}</code>`];
    case "task.verify_failed": return ["✗", h`Verification failed for ${t(d.slug)} (exit ${d.exit}): <code>${d.cmd}</code>`];
    case "question.asked": return ["?", h`Asked: ${d.text}`];
    case "question.answered": return ["✎", h`Answered: ${d.option ? `option ${d.option}` : ""}${d.text ? ` “${d.text}”` : ""}`];
    default: return ["·", h`${e.type}`];
  }
}
function feed(events) {
  const nByEvent = new Map(), counts = new Map();
  for (const e of data.events) if (e.type === "slot.versioned") { const n = (counts.get(e.data.key) ?? 0) + 1; counts.set(e.data.key, n); nByEvent.set(e.id, n); }
  let day = "";
  const out = [];
  let items = [];
  const flush = () => { if (items.length) out.push(h`<ul class="feed">${items}</ul>`); items = []; };
  for (const e of events) {
    const dd = new Date(e.at).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    if (dd !== day) { flush(); out.push(h`<div class="day">${dd}</div>`); day = dd; }
    const [ic, what] = describe(e, nByEvent);
    items.push(h`<li><span class="ic">${ic}</span><span class="what">${what}<span class="who">· ${actor(e.actor)}</span></span><span class="when">${when(e.at)}</span></li>`);
  }
  flush();
  return out.length ? out : [h`<div class="emptybig">No activity yet.</div>`];
}

function overview(d) {
  const needs = d.userQs.length + d.proposed.length;
  const verified = data.tasks.filter((t) => t.status === "verified").length;
  const liveSlots = data.slots.filter(live);
  const recent = [...data.events].reverse().filter((e) => e.type !== "session.started" && e.type !== "session.ended").slice(0, 15);
  return h`<div class="split"><div>
    <div class="stats">
      <a class="stat ${needs ? "hot" : ""}" href="#overview"><b>${needs}</b><small>need your call</small></a>
      <a class="stat" href="#decisions"><b>${liveSlots.length}</b><small>live decisions · ${liveSlots.filter((s) => s.current.status === "decided").length} decided</small></a>
      <a class="stat" href="#tasks"><b>${d.openTasks.length}</b><small>open tasks · ${verified} verified</small></a>
      <a class="stat ${d.stale.length ? "bad" : ""}" href="#decisions"><b>${d.stale.length}</b><small>changed premises</small></a>
    </div>
    ${d.userQs.length ? h`<h2>Questions for you</h2>${d.userQs.filter((q) => match(q.text, q.about)).map(questionCard)}` : ""}
    ${d.proposed.length ? h`<h2>Decisions the AI made for you</h2>
      <div class="hint" style="margin:-4px 0 10px">Each stays a proposal until you confirm it or ${data.config.acceptAfterSessions} more sessions pass. To change one, tell Claude in your session.</div>
      ${d.proposed.filter((s) => match(s.key, s.current.value, s.current.rationale)).map((s) => decisionCard(s, d))}` : ""}
    ${d.stale.filter((s) => s.current.status !== "proposed").length ? h`<h2>Premises that changed</h2>${d.stale.filter((s) => s.current.status !== "proposed").map((s) => decisionCard(s, d))}` : ""}
    ${!needs && !d.stale.length ? h`<h2>Needs your call</h2><div class="emptybig">Nothing needs you right now.</div>` : ""}
    </div><aside>
    <h2>Recent activity</h2>${feed(recent)}
    ${data.events.length > recent.length ? h`<div class="hint"><a href="#activity">See all activity →</a></div>` : ""}
    </aside></div>`;
}

function decisions(d) {
  const all = data.slots.filter((s) => (ui.showOld || live(s)) && (ui.cat === "all" || s.category === ui.cat));
  const shown = all.filter((s) => { const v = s.current ?? s.versions.at(-1); return match(s.key, v.value, v.rationale, s.topics); });
  const count = (c) => data.slots.filter((s) => (ui.showOld || live(s)) && (c === "all" || s.category === c)).length;
  const groups = CATS.map((c) => [c, shown.filter((s) => s.category === c).sort((a, b) => a.key.localeCompare(b.key))]).filter(([, l]) => l.length);
  return h`<div class="filters">
      ${["all", ...CATS].filter((c) => c === "all" || count(c)).map((c) => h`<button data-cat="${c}" class="${ui.cat === c ? "on" : ""}">${c === "all" ? "All" : CAT_LABEL[c]} ${count(c)}</button>`)}
      <label><input type="checkbox" id="showOld" ${ui.showOld ? new Raw("checked") : ""}> Show retired and rejected</label>
    </div>
    ${groups.length ? groups.map(([c, l]) => h`<h2>${CAT_LABEL[c]}</h2>${l.map((s) => decisionCard(s, d))}`) : h`<div class="emptybig">${data.slots.length ? "No decisions match." : "No decisions recorded yet."}</div>`}`;
}

function tasks() {
  const cols = ["todo", "in_progress", "implemented", "verified"];
  const ts = data.tasks.filter((t) => match(t.slug, t.title, t.note));
  const dropped = ts.filter((t) => t.status === "dropped");
  return h`<div class="cols">${cols.map((c) => {
      const l = ts.filter((t) => t.status === c);
      return h`<div class="col"><h3><span class="pill ${c}">${TASK_LABEL[c]}</span><span class="n">${l.length}</span></h3>${l.length ? l.map(taskCard) : h`<div class="empty">None</div>`}</div>`;
    })}</div>
    ${dropped.length ? h`<details data-id="dropped" ${ui.open.has("dropped") ? new Raw("open") : ""}><summary>Dropped · ${dropped.length}</summary><div style="margin-top:10px">${dropped.map(taskCard)}</div></details>` : ""}`;
}

function sessions() {
  const list = [...data.sessions].sort((a, b) => (a.start.at < b.start.at ? 1 : -1));
  if (!list.length) return h`<div class="emptybig">No sessions yet.</div>`;
  return list.map((s) => {
    const done = data.events.filter((e) => (e.actor.session ?? e.actor.via) === s.id && (e.type === "task.verified" || (e.type === "task.status" && e.data.status === "implemented")));
    return h`<div class="card">
      <div class="head"><span class="key">${short(s.id)}</span>
        <span class="pill ${s.end ? "plain" : "verified"}">${s.end ? "Ended" : "Open"}</span>
        <span class="pill plain">${s.client.name}${s.client.version ? " " + s.client.version : ""}</span>
        <span class="right">${new Date(s.start.at).toLocaleString()}</span></div>
      <div class="meta">
        ${s.wrote.length ? h`<span class="lbl">Decisions</span>${s.wrote.map((k) => chip(k))}` : h`<span>No decisions recorded</span>`}
        ${done.length ? h`<span class="lbl">Work</span>${[...new Set(done.map((e) => e.data.slug))].map((slug) => h`<a class="chip" href="#tasks" data-task="${slug}">${slug}</a>`)}` : ""}
      </div>
      ${s.start.snapshot?.head ? h`<div class="hint">Started at commit <code>${s.start.snapshot.head.slice(0, 7)}</code>${s.end?.snapshot?.head && s.end.snapshot.head !== s.start.snapshot.head ? h`, ended at <code>${s.end.snapshot.head.slice(0, 7)}</code>` : ""}</div>` : ""}
    </div>`;
  });
}

// ---------- render ----------
function render() {
  if (!data) return;
  const d = derive();
  document.getElementById("project").textContent = "· " + data.project;
  document.title = `${data.project} · slotboard`;
  const badge = { overview: [d.userQs.length + d.proposed.length, true], decisions: [data.slots.filter(live).length], tasks: [d.openTasks.length], activity: [data.events.length], sessions: [data.sessions.length] };
  document.getElementById("nav").innerHTML = TABS.map(([id, label]) => {
    const [n, hot] = badge[id];
    return h`<a href="#${id}" class="${ui.tab === id ? "on" : ""}">${label}${n ? h`<span class="n ${hot ? "hot" : ""}">${n}</span>` : ""}</a>`;
  }).join("");
  const body = { overview, decisions, tasks, activity: () => feed([...data.events].reverse().filter((e) => match(JSON.stringify(e.data)))), sessions }[ui.tab](d);
  const banner = data.errors ? h`<div class="banner">⚠ slotboard failed to sync ${data.errors} time(s); some records may be missing. See <code>.project/run/errors.log</code>.</div>` : "";
  const y = window.scrollY;
  document.getElementById("main").innerHTML = h`${banner}${body}`.s;
  window.scrollTo(0, y);
}

function route() {
  const [tab, ...rest] = location.hash.slice(1).split("/");
  const next = TABS.some(([id]) => id === tab) ? tab : "overview";
  const switched = next !== ui.tab;
  ui.tab = next;
  render();
  const target = rest.join("/");
  if (target) focus(document.getElementById(target));
  else if (switched) window.scrollTo(0, 0);
}
function focus(el) {
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1400);
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) {
    e.preventDefault();
    const key = go.dataset.go;
    const s = slotOf(key);
    if (s && !live(s)) ui.showOld = true;
    if (s && ui.cat !== "all" && ui.cat !== s.category) ui.cat = "all";
    if (location.hash === "#decisions/" + key) route(); else location.hash = "decisions/" + key;
    return;
  }
  const task = e.target.closest("[data-task]");
  if (task) {
    e.preventDefault();
    ui.tab = "tasks";
    history.pushState(null, "", "#tasks");
    render();
    focus(document.getElementById("task-" + task.dataset.task));
    return;
  }
  const cat = e.target.closest("[data-cat]");
  if (cat) { ui.cat = cat.dataset.cat; saveUi(); render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "showOld") { ui.showOld = e.target.checked; saveUi(); render(); }
});
document.addEventListener("toggle", (e) => {
  const id = e.target.dataset?.id;
  if (id) e.target.open ? ui.open.add(id) : ui.open.delete(id);
}, true);
document.getElementById("search").addEventListener("input", (e) => { ui.q = e.target.value.trim(); render(); });
window.addEventListener("hashchange", route);

// ---------- live updates ----------
async function poll() {
  try {
    const r = await fetch("/api/state", { headers: etag ? { "If-None-Match": etag } : {}, cache: "no-store" });
    if (r.status === 200) {
      data = await r.json();
      etag = r.headers.get("ETag");
      const first = !lastOk;
      lastOk = Date.now();
      first ? route() : render();
    } else if (r.status === 304) lastOk = Date.now();
    else throw new Error(String(r.status));
    setLive(true);
  } catch {
    setLive(false);
  }
  setTimeout(poll, document.hidden ? 10000 : 2000);
}
function setLive(ok) {
  document.getElementById("live").classList.toggle("off", !ok);
  document.getElementById("liveText").textContent = ok ? "Live" : lastOk ? "Disconnected · retrying" : "Can't reach slotboard web";
}
setInterval(() => document.querySelectorAll("time[datetime]").forEach((t) => { t.textContent = ago(t.getAttribute("datetime")); }), 30000);
poll();
</script>
</body>
</html>
